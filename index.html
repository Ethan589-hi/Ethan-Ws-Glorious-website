<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link id="apple-icon" rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link id="favicon-32" rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link id="favicon-16" rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">

    <title>Calculator</title>
    
    <style>
        /* --- DECOY CALCULATOR STYLES --- */
        #decoy-cover {
            background-color: #f4f4f6;
            color: #333;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .secret-trigger {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 65px;
            height: 65px;
            border-radius: 8px;
            cursor: pointer;
            object-fit: contain; 
            background-color: #fff;
            border: 1px solid #ccc;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: opacity 0.2s;
            display: none; 
        }

        .secret-trigger:hover { opacity: 0.8; }
        .calc-title { font-size: 2rem; font-weight: 600; margin-top: 40px; margin-bottom: 20px; color: #222; }

        .calculator-box {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 340px;
        }

        #calc-screen {
            width: 100%;
            height: 60px;
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 2rem;
            text-align: right;
            padding: 10px;
            box-sizing: border-box;
            color: #222;
        }

        .calc-buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }

        .btn {
            background-color: #f1f3f5;
            border: none;
            padding: 18px;
            border-radius: 12px;
            font-size: 1.25rem;
            font-weight: 600;
            cursor: pointer;
            color: #333;
            user-select: none;
        }

        .btn:active { background-color: #e2e6ea; }
        .btn.operator { background-color: #e8f0fe; color: #1a73e8; }
        .btn.operator:active { background-color: #d2e3fc; }
        .btn.clear { background-color: #fce8e6; color: #d93025; }
        .btn.equal { background-color: #1a73e8; color: white; grid-column: span 2; }
        .btn.equal:active { background-color: #1557b0; }

        /* --- REAL ARCADE WEBSITE STYLES --- */
        #main-arcade-content { display: none; }

        body.arcade-mode {
            margin: 0;
            padding: 20px;
            background-color: #111;
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?auto=format&fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: Arial, sans-serif;
            color: white;
            transition: background 0.3s ease;
        }

        .control-bar {
            max-width: 1200px;
            margin: 10px auto 20px auto;
            display: flex;
            gap: 10px;
            padding-left: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .bg-btn, .upload-label, .mask-btn {
            background-color: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: background 0.2s;
            font-size: 0.9rem;
        }

        .bg-btn:hover, .upload-label:hover, .mask-btn:hover { background-color: #333; }
        #bg-upload { display: none; }

        .search-container { margin-left: auto; padding-right: 20px; }
        .search-bar {
            background-color: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            width: 220px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-bar:focus { border-color: #1a73e8; }

        h2 { text-align: left; max-width: 1200px; margin: 30px auto 10px auto; font-size: 1.8rem; padding-left: 20px; }

        .arcade-screen-container { max-width: 1160px; margin: 20px auto; padding: 0 20px; }
        .game-frame-wrapper {
            position: relative;
            width: 100%;
            height: 600px;
            background: #181818;
            border-radius: 18px;
            overflow: hidden;
            border: 2px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .game-frame-wrapper iframe { width: 100%; height: 100%; border: none; }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
            gap: 16px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .game-card {
            background: #1c1c1e;
            border-radius: 16px;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            cursor: pointer;
            position: relative;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        .game-card:hover { transform: scale(1.06); box-shadow: 0 6px 16px rgba(0,0,0,0.6); }
        .game-icon { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; }

        .game-title {
            background-color: #111112;
            color: #e5e5ea;
            font-size: 0.8rem;
            padding: 8px 6px;
            text-align: center;
            font-weight: 600;
            border-top: 1px solid #2c2c2e;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .fav-star {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(0, 0, 0, 0.6);
            border: none;
            color: #aaa;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: transform 0.2s, color 0.2s;
        }

        .fav-star:hover { transform: scale(1.2); }
        .game-card.is-favorite .fav-star { color: #ffeb3b; }

        #favorites-grid .game-card {
            box-shadow: 0 0 12px rgba(255, 235, 59, 0.4);
            border: 1px solid rgba(255, 235, 59, 0.3);
        }
        #favorites-grid .game-card .game-title { color: #ffeb3b; }

        .hidden { display: none !important; }
    </style>
</head>
<body id="body-context">

    <div id="decoy-cover">
        <img id="takaba-img" class="secret-trigger" src="https://images.weserv.nl/?url=static.wikia.nocookie.net/jujutsu-kaisen/images/a/aa/Fumihiko_Takaba.png" alt="Trigger Link" onclick="revealRealSite()">
        
        <div class="calc-title">Calculator</div>
        <div class="calculator-box">
            <div id="calc-screen">0</div>
            <div class="calc-buttons">
                <button class="btn clear" onclick="clearScreen()">C</button>
                <button class="btn operator" onclick="pressOp('/')">/</button>
                <button class="btn operator" onclick="pressOp('*')">*</button>
                <button class="btn operator" onclick="pressOp('-')">-</button>
                
                <button class="btn" onclick="pressNum('7')">7</button>
                <button class="btn" onclick="pressNum('8')">8</button>
                <button class="btn" onclick="pressNum('9')">9</button>
                <button class="btn operator" onclick="pressOp('+')">+</button>
                
                <button class="btn" onclick="pressNum('4')">4</button>
                <button class="btn" onclick="pressNum('5')">5</button>
                <button class="btn" onclick="pressNum('6')">6</button>
                <button class="btn" onclick="pressNum('.')">.</button>
                
                <button class="btn" onclick="pressNum('1')">1</button>
                <button class="btn" onclick="pressNum('2')">2</button>
                <button class="btn" onclick="pressNum('3')">3</button>
                
                <button class="btn equal" onclick="calculate()">=</button>
                <button class="btn" onclick="pressNum('0')">0</button>
            </div>
        </div>
    </div>

    <div id="main-arcade-content">
        <div class="control-bar">
            <button class="bg-btn" onclick="changeBackground()">🖼️ Preset Backgrounds</button>
            <label for="bg-upload" class="upload-label">📤 Upload Wallpaper</label>
            <input type="file" id="bg-upload" accept="image/*" onchange="uploadBackground(event)">
            <button class="mask-btn" onclick="toggleMask()">🎭 Mask Tab</button>
            
            <div class="search-container">
                <input type="text" id="arcade-search" class="search-bar" placeholder="🔍 Search games..." onkeyup="filterGames()">
            </div>
        </div>

        <div id="favorites-section" class="hidden">
            <h2>⭐ Favourites</h2>
            <div class="game-grid" id="favorites-grid"></div>
        </div>

        <div id="live-player-section" class="arcade-screen-container hidden">
            <h2 id="now-playing-title">Now Playing</h2>
            <div class="game-frame-wrapper">
                <iframe id="arcade-viewport" src="" allowfullscreen></iframe>
            </div>
        </div>

        <h2>All Games</h2>
        <div class="game-grid" id="all-games-grid">

            <div class="game-card" data-id="plague-inc" onclick="loadGame('Plague Inc.', 'https://harshulmoon.github.io/iframes/plagueinc.html')">
                <button class="fav-star" onclick="event.stopPropagation(); toggleFavorite('plague-inc')">★</button>
                <img class="game-icon" src="https://images.unsplash.com/photo-1584036561566-baf8f5f1b144?auto=format&fit=crop&w=400&q=80" alt="Plague Inc.">
                <div class="game-title">Plague Inc.</div>
            </div>

            <div class="game-card" data-id="subway-surfers" onclick="loadGame('Subway Surfers', 'https://harshulmoon.github.io/iframes/subwaysurfers.html')">
                <button class="fav-star" onclick="event.stopPropagation(); toggleFavorite('subway-surfers')">★</button>
                <img class="game-icon" src="https://harshulmoon.github.io/images/subwaysurfers.png" alt="Subway Surfers">
                <div class="game-title">Subway Surfers</div>
            </div>

            <div class="game-card" data-id="eggy-car" onclick="loadGame('Eggy Car', 'https://harshulmoon.github.io/iframes/eggycar.html')">
                <button class="fav-star" onclick="event.stopPropagation(); toggleFavorite('eggy-car')">★</button>
                <img class="game-icon" src="https://harshulmoon.github.io/images/eggycar.png" alt="Eggy Car">
                <div class="game-title">Eggy Car</div>
            </div>

            <div class="game-card" data-id="papas-pizzeria" onclick="loadGame('Papa\'s Pizzeria', 'https://harshulmoon.github.io/iframes/papaspizzeria.html')">
                <button class="fav-star" onclick="event.stopPropagation(); toggleFavorite('papas-pizzeria')">★</button>
                <img class="game-icon" src="https://harshulmoon.github.io/images/papaspizzeria.png" alt="Papa's Pizzeria">
                <div class="game-title">Papa's Pizzeria</div>
            </div>

            <div class="game-card" data-id="papas-burgeria" onclick="loadGame('Papa\'s Burgeria', 'https://harshulmoon.github.io/iframes/papasburgeria.html')">
                <button class="fav-star" onclick="event.stopPropagation(); toggleFavorite('papas-burgeria')">★</button>
                <img class="game-icon" src="https://cdn.pixabay.com/photo/2014/04/03/11/57/blocks-312610_640.png" alt="Papa's Burgeria">
                <div class="game-title">Papa's Burgeria</div>
            </div>

            <div class="game-card" data-id="getaway-shootout" onclick="loadGame('Getaway Shootout', 'https://harshulmoon.github.io/iframes/getawayshootout.html')">
                <button class="fav-star" onclick="event.stopPropagation(); toggleFavorite('getaway-shootout')">★</button>
                <img class="game-icon" src="https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=400&q=80" alt="Getaway Shootout">
                <div class="game-title">Getaway Shootout</div>
            </div>

            <div class="game-card" data-id="retro-bowl" onclick="loadGame('Retro Bowl', 'https://game321.github.io/game/retro-bowl/')">
                <button class="fav-star" onclick="event.stopPropagation(); toggleFavorite('retro-bowl')">★</button>
                <img class="game-icon" src="https://cdn.pixabay.com/photo/2016/09/24/20/05/american-football-1692440_640.jpg" alt="Retro Bowl">
                <div class="game-title">Retro Bowl</div>
            </div>

            <div class="game-card" data-id="slope" onclick="loadGame('Slope', 'https://math-play.github.io/slope/')">
                <button class="fav-star" onclick="event.stopPropagation(); toggleFavorite('slope')">★</button>
                <img class="game-icon" src="https://cdn.pixabay.com/photo/2016/11/29/06/15/plans-1867745_640.jpg" alt="Slope">
                <div class="game-title">Slope</div>
            </div>

            <div class="game-card" data-id="run-3" onclick="loadGame('Run 3', 'https://jojogamer2020.github.io/NeonGames/games/run3/')">
                <button class="fav-star" onclick="event.stopPropagation(); toggleFavorite('run-3')">★</button>
                <img class="game-icon" src="https://images.unsplash.com/photo-1551103782-8ab07afd45c1?auto=format&fit=crop&w=400&q=80" alt="Run 3">
                <div class="game-title">Run 3</div>
            </div>

            <div class="game-card" data-id="1v1-lol" onclick="loadGame('1v1.LOL', 'https://webglmath.github.io/1v1-lol/')">
                <button class="fav-star" onclick="event.stopPropagation(); toggleFavorite('1v1-lol')">★</button>
                <img class="game-icon" src="https://cdn.pixabay.com/photo/2013/07/13/12/46/gaming-160293_640.png" alt="1v1.LOL">
                <div class="game-title">1v1.LOL</div>
            </div>

            <div class="game-card" data-id="drive-mad" onclick="loadGame('Drive Mad', 'https://pure-gamedev.github.io/drive-mad/')">
                <button class="fav-star" onclick="event.stopPropagation(); toggleFavorite('drive-mad')">★</button>
                <img class="game-icon" src="https://cdn.pixabay.com/photo/2016/11/17/12/32/pixel-1831341_640.png" alt="Drive Mad">
                <div class="game-title">Drive Mad</div>
            </div>

            <div class="game-card" data-id="minecraft" onclick="loadGame('Minecraft Classic', 'https://classic.minecraft.net/')">
                <button class="fav-star" onclick="event.stopPropagation(); toggleFavorite('minecraft')">★</button>
                <img class="game-icon" src="https://images.unsplash.com/photo-1607988795691-3d0147b43231?auto=format&fit=crop&w=400&q=80" alt="Minecraft">
                <div class="game-title">Minecraft</div>
            </div>

        </div>
    </div>

    <script>
        // CALCULATOR REVEAL TRIGGERS
        let currentInput = "0";
        const screen = document.getElementById("calc-screen");

        function updateScreen() { screen.innerText = currentInput; }
        function pressNum(num) { if (currentInput === "0" && num !== ".") { currentInput = num; } else { currentInput += num; } updateScreen(); }
        function pressOp(op) { currentInput += " " + op + " "; updateScreen(); }
        function clearScreen() { currentInput = "0"; updateScreen(); }
        
        function calculate() { 
            let trimmedInput = currentInput.trim();
            if (trimmedInput === "" || trimmedInput === "0") {
                document.getElementById('takaba-img').style.display = 'block';
            } else {
                try { 
                    currentInput = String(Function('"use strict";return (' + currentInput + ')')()); 
                } catch (e) { 
                    currentInput = "Error"; 
                } 
                updateScreen(); 
            }
        }

        function filterGames() {
            let filter = document.getElementById('arcade-search').value.toLowerCase();
            let cards = document.querySelectorAll('#all-games-grid .game-card');
            cards.forEach(card => {
                let title = card.querySelector('.game-title').innerText.toLowerCase();
                if (title.includes(filter)) { card.classList.remove('hidden'); } else { card.classList.add('hidden'); }
            });
        }

        function revealRealSite() {
            document.getElementById('decoy-cover').style.display = 'none';
            document.getElementById('main-arcade-content').style.display = 'block';
            document.getElementById('body-context').className = 'arcade-mode';
            document.title = "Ethan Ws Glorious Website";
        }

        // VIEWPORT INTERFACE DISPLAY
        function loadGame(title, url) {
            const playerSection = document.getElementById('live-player-section');
            const viewport = document.getElementById('arcade-viewport');
            const titleHeader = document.getElementById('now-playing-title');
            
            titleHeader.innerText = "Now Playing: " + title;
            viewport.src = url;
            playerSection.classList.remove('hidden');
            playerSection.scrollIntoView({ behavior: 'smooth' });
        }

        const backgrounds = [
            "https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?auto=format&fit=crop&w=1200&q=80",
            "https://images.unsplash.com/photo-1579546929518-9e396f3cc809?auto=format&fit=crop&w=1200&q=80"
        ];
        let currentBgIndex = 0;
        function changeBackground() { currentBgIndex = (currentBgIndex + 1) % backgrounds.length; document.body.style.backgroundImage = `linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('${backgrounds[currentBgIndex]}')`; }
        function uploadBackground(event) { const file = event.target.files[0]; if (file) { const reader = new FileReader(); reader.onload = function(e) { document.body.style.backgroundImage = `linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('${e.target.result}')`; }; reader.readAsDataURL(file); } }

        let isMasked = false;
        function toggleMask() {
            const appleIcon = document.getElementById('apple-icon');
            const fav32 = document.getElementById('favicon-32');
            if (!isMasked) {
                document.title = "About Blank";
                if(appleIcon) appleIcon.setAttribute('href', 'https://www.google.com/favicon.ico');
                if(fav32) fav32.setAttribute('href', 'https://www.google.com/favicon.ico');
                isMasked = true;
            } else {
                document.title = "Ethan Ws Glorious Website";
                if(appleIcon) appleIcon.setAttribute('href', '/apple-touch-icon.png');
                if(fav32) fav32.setAttribute('href', '/favicon-32x32.png');
                isMasked = false;
            }
        }

        let favorites = JSON.parse(localStorage.getItem('arcadeFavorites')) || [];

        function initFavorites() {
            const grid = document.getElementById('favorites-grid');
            grid.innerHTML = '';
            if (favorites.length === 0) {
                document.getElementById('favorites-section').classList.add('hidden');
            } else {
                document.getElementById('favorites-section').classList.remove('hidden');
            }

            const allCards = document.querySelectorAll('#all-games-grid .game-card');
            allCards.forEach(card => {
                const id = card.getAttribute('data-id');
                if (favorites.includes(id)) {
                    card.classList.add('is-favorite');
                    const clone = card.cloneNode(true);
                    clone.onclick = card.onclick;
                    clone.querySelector('.fav-star').onclick = function(e) { e.stopPropagation(); toggleFavorite(id); };
                    grid.appendChild(clone);
                } else {
                    card.classList.remove('is-favorite');
                }
            });
        }

        function toggleFavorite(id) {
            favorites = favorites.includes(id) ? favorites.filter(favId => favId !== id) : [...favorites, id];
            localStorage.setItem('arcadeFavorites', JSON.stringify(favorites));
            initFavorites();
        }

        window.onload = initFavorites;
    </script>
</body>
</html>
